services:
  bot:
    build:
      context: .
      args:
        # Flip to "true" once you're past paper trading and ready to install
        # the live-execution dependencies (solana/ccxt/web3).
        INSTALL_LIVE_DEPS: "false"
    image: memecoin-bot:latest
    container_name: memecoin-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Snapshots. Mounted separately from ./data on purpose: if the two
      # shared a volume, anything that wiped the database directory would
      # take the backups with it - which is the failure this is for.
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --- Optional: Caddy reverse proxy with automatic HTTPS for production. ---
