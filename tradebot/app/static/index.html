<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Bot</title>
<style>
  :root {
    --bg: #0c0f14; --panel: #131820; --panel-2: #181f2a; --line: #232c3a;
    --text: #e6edf6; --muted: #8b98ad; --dim: #5d6a7e;
    --long: #22c55e; --short: #ef4444; --warn: #f59e0b; --accent: #5b9dff;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  button {
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 7px; cursor: pointer;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  }
  button:hover { border-color: var(--dim); }
  button.danger { background: #3a1416; border-color: #6b2226; color: #ffb4b4; }
  button.go { background: #10301c; border-color: #1e5c34; color: #9ff0bd; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .sym { font-size: 18px; font-weight: 650; letter-spacing: .01em; }
  .tf { color: var(--muted); font-size: 13px; }
  .price { font-family: var(--mono); font-size: 22px; font-weight: 600; margin-left: 4px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); white-space: nowrap;
  }
  .pill.ok { color: #9ff0bd; border-color: #1e5c34; }
  .pill.bad { color: #ffb4b4; border-color: #6b2226; }
  .pill.warn { color: #ffd79a; border-color: #6b4a12; }

  main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr);
         gap: 14px; padding: 14px; align-items: start; }
  @media (max-width: 1080px) { main { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }

  canvas { width: 100%; height: 320px; display: block; border-radius: 6px; background: #0a0d12; }

  .signal { border-left: 4px solid var(--dim); }
  .signal.long { border-left-color: var(--long); }
  .signal.short { border-left-color: var(--short); }
  .signal.none { border-left-color: var(--warn); }
  .sig-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sig-dir { font-size: 26px; font-weight: 750; letter-spacing: .02em; }
  .long .sig-dir { color: var(--long); } .short .sig-dir { color: var(--short); }
  .none .sig-dir { color: var(--warn); font-size: 20px; }
  .sig-time { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-left: auto; }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px; margin-top: 12px; }
  .level { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
  .level .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  .level .v { font-family: var(--mono); font-size: 17px; font-weight: 600; margin-top: 2px; }
  .level.stop .v { color: var(--short); } .level.tp .v { color: var(--long); }
  .blocked { margin-top: 10px; padding: 9px 11px; background: #2a1f0c; border-radius: 7px;
             color: #ffd79a; font-size: 13px; }
  .ai-note { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .ai-note b { color: var(--text); font-weight: 600; }

  .checks { display: flex; flex-direction: column; gap: 5px; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 4px 0;
           border-bottom: 1px solid #1a212c; }
  .check:last-child { border-bottom: 0; }
  .check .mark { width: 15px; text-align: center; font-weight: 700; flex: none; }
  .check.pass .mark { color: var(--long); } .check.fail .mark { color: var(--short); }
  .check .nm { font-family: var(--mono); font-size: 12px; min-width: 150px; flex: none; }
  .check.fail .nm { color: #ffb4b4; }
  .check .dt { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .check .opt { font-size: 10px; color: var(--dim); border: 1px solid var(--line);
                border-radius: 4px; padding: 0 4px; flex: none; }

  .kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; }
  .pos { color: var(--long); } .neg { color: var(--short); }

  .bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px;
       text-transform: uppercase; letter-spacing: .05em; padding-bottom: 6px; }
  td { padding: 5px 0; border-top: 1px solid #1a212c; font-family: var(--mono); }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 0; }

  .chat { display: flex; flex-direction: column; height: 460px; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
         padding-right: 4px; margin-bottom: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px;
         white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #1c3050; border: 1px solid #27456e; }
  .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); }
  .msg.sys { align-self: center; color: var(--dim); font-size: 12px; background: none; padding: 2px; }
  .composer { display: flex; gap: 8px; }
  .composer textarea {
    flex: 1; resize: none; height: 40px; padding: 9px 11px; border-radius: 8px; font: inherit;
    font-size: 13.5px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 9px; }
  .suggest button { font-size: 11.5px; padding: 4px 9px; color: var(--muted); }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .muted { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>

<header>
  <div>
    <span class="sym" id="symbol">—</span>
    <span class="tf" id="timeframe"></span>
    <span class="price" id="price">—</span>
  </div>
  <div class="pills" id="pills"></div>
  <div style="display:flex;gap:7px">
    <button id="btn-flatten">Flatten</button>
    <button id="btn-kill" class="danger">Kill switch</button>
  </div>
</header>

<main>
  <div class="col">
    <section class="card">
      <h2>Chart</h2>
      <canvas id="chart"></canvas>
      <div class="muted" id="chart-legend" style="margin-top:8px"></div>
    </section>

    <section class="card signal none" id="signal-card">
      <div class="sig-head">
        <span class="sig-dir" id="sig-dir">Waiting for a setup</span>
        <span class="sig-time" id="sig-time"></span>
      </div>
      <div id="sig-body"></div>
    </section>

    <section class="card">
      <h2>Strategy checks <span id="score" class="muted"></span></h2>
      <div class="checks" id="checks"><div class="empty">No evaluation yet.</div></div>
    </section>
  </div>

  <div class="col">
    <section class="card">
      <h2>Risk</h2>
      <dl class="kv" id="risk"></dl>
      <div class="bar"><i id="risk-bar" style="width:0%"></i></div>
    </section>

    <section class="card">
      <h2>System health</h2>
      <dl class="kv" id="health"></dl>
    </section>

    <section class="card">
      <h2>Open positions</h2>
      <div id="positions"><div class="empty">Flat.</div></div>
    </section>

    <section class="card">
      <h2>Recent signals</h2>
      <div id="history"><div class="empty">Nothing yet.</div></div>
    </section>

    <section class="card chat">
      <h2>Ask the bot</h2>
      <div class="suggest" id="suggest"></div>
      <div class="log" id="log"></div>
      <div class="composer">
        <textarea id="input" placeholder="Why was that skipped?  (Enter to send)"></textarea>
        <button id="send">Send</button>
      </div>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 2) => (v === null || v === undefined) ? "—" : `${Number(v).toFixed(d)}%`;

let state = null;
let candles = [];
let socket = null;
let reconnectDelay = 1000;

/* ---------------------------------------------------------------- socket */

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(`${proto}://${location.host}/ws`);

  socket.onopen = () => { reconnectDelay = 1000; setPill("conn", "live", "ok"); loadCandles(); };
  socket.onclose = () => {
    setPill("conn", "disconnected", "bad");
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.7, 15000);
  };
  socket.onmessage = (event) => {
    let msg; try { msg = JSON.parse(event.data); } catch { return; }
    handle(msg.type, msg.data);
  };
}

function send(payload) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(payload));
}

function handle(type, data) {
  switch (type) {
    case "state":
      state = data; renderAll(); break;
    case "tick":
      if (data.context) { state && (state.context = data.context); }
      if (data.positions) { state && (state.positions = data.positions); }
      pushCandle(data.candle);
      renderHeader(); renderPositions(); drawChart(); break;
    case "signal":
      onSignal(data); break;
    case "evaluation":
      renderChecks(data.verdict, data.reason); break;
    case "trade_closed":
      if (state) { state.risk = data.risk; }
      logSystem(`Closed ${data.trade.side} ${data.trade.symbol}: ${data.trade.pnl >= 0 ? "+" : ""}${fmt(data.trade.pnl)} (${fmt(data.trade.r_multiple)}R)`);
      renderRisk(); send({ action: "state" }); break;
    case "kill_switch":
      renderHeader(); send({ action: "state" }); break;
    case "chat_start": chatStart(data.id); break;
    case "chat_delta": chatDelta(data.id, data.text); break;
    case "chat_end": chatEnd(data.id); break;
    case "chat_reset": $("log").innerHTML = ""; break;
    case "flattened":
      logSystem(`Flattened ${data.closed.length} position(s).`); break;
    case "reconciliation":
      if (state?.status) state.status.reconciliation = data;
      logSystem(data.ok ? `Reconciled: ${data.message}` : `Reconciliation FAILED: ${data.message}`);
      renderHeader(); renderHealth(); break;
    case "error":
      logSystem(data.message || "error"); break;
  }
}

/* ----------------------------------------------------------------- data */

async function loadCandles() {
  try {
    const res = await fetch("/api/candles?limit=180");
    const data = await res.json();
    candles = data.candles || [];
    drawChart();
  } catch { /* the socket will resync on the next tick */ }
}

function pushCandle(c) {
  if (!c) return;
  const last = candles[candles.length - 1];
  if (last && last.ts === c.ts) candles[candles.length - 1] = c;
  else candles.push(c);
  if (candles.length > 400) candles = candles.slice(-300);
}

/* -------------------------------------------------------------- render */

function renderAll() {
  renderHeader(); renderSignal(state?.last_actionable_signal, state?.recent_signals);
  renderChecksFromState(); renderRisk(); renderPositions(); renderHistory();
}

function setPill(key, text, cls = "") {
  const pills = $("pills");
  let el = pills.querySelector(`[data-k="${key}"]`);
  if (!el) { el = document.createElement("span"); el.dataset.k = key; pills.appendChild(el); }
  el.className = `pill ${cls}`; el.textContent = text;
}

function renderHeader() {
  const s = state?.status; if (!s) return;
  $("symbol").textContent = s.symbol;
  $("timeframe").textContent = s.timeframe;
  $("price").textContent = fmt(s.last_price);

  setPill("mode", s.execution_mode.replace("_", " "), s.execution_mode === "paper" ? "" : "warn");
  const feed = s.feed || {};
  setPill("feed", feed.stale ? `FEED STALE (${Math.round(feed.bar_age_seconds)}s)` : `feed: ${s.feed_source}`,
          feed.stale ? "bad" : "");
  const rec = s.reconciliation || {};
  if (rec.ok === false) setPill("rec", "POSITION MISMATCH", "bad");
  else { const el = $("pills").querySelector('[data-k="rec"]'); if (el) el.remove(); }
  const ai = s.ai || {};
  setPill("ai", ai.enabled ? (ai.ready ? "AI ready" : "AI: no key") : "AI off",
          ai.enabled ? (ai.ready ? "ok" : "warn") : "");
  if (s.vision?.enabled) setPill("vision", `vision: ${s.vision.mode}`, "");
  const risk = state?.risk;
  if (risk?.kill_switch) setPill("kill", "HALTED", "bad");
  else { const el = $("pills").querySelector('[data-k="kill"]'); if (el) el.remove(); }
  $("btn-kill").textContent = risk?.kill_switch ? "Resume" : "Kill switch";
  $("btn-kill").className = risk?.kill_switch ? "go" : "danger";
}

function onSignal(sig) {
  if (!state) return;
  state.recent_signals = [...(state.recent_signals || []), sig].slice(-12);
  if (sig.actionable) state.last_actionable_signal = sig;
  renderSignal(sig.actionable ? sig : state.last_actionable_signal, state.recent_signals);
  renderChecks(sig.strategy_verdict, sig.blocked_by);
  renderHistory(); renderRisk(); drawChart();
  if (sig.actionable) logSystem(`${sig.side} ${sig.symbol} @ ${fmt(sig.entry)} — stop ${fmt(sig.stop)}`);
}

function renderSignal(sig, recent) {
  const card = $("signal-card");
  const latest = (recent && recent.length) ? recent[recent.length - 1] : null;
  const show = sig && sig.actionable ? sig : null;

  if (!show) {
    card.className = "card signal none";
    $("sig-dir").textContent = latest ? "No trade" : "Waiting for a setup";
    $("sig-time").textContent = latest ? new Date(latest.ts).toLocaleTimeString() : "";
    const sizing = latest?.risk?.sizing;
    $("sig-body").innerHTML = (latest?.blocked_by
      ? `<div class="blocked">${esc(latest.blocked_by)}</div>`
      : `<div class="muted">The rules haven't lined up yet.</div>`)
      + (sizing && sizing.stop_risk_per_contract
        ? `<div class="muted" style="margin-top:8px">risk budget ${fmt(sizing.risk_dollars)}
           ÷ ${fmt(sizing.stop_risk_per_contract)} per contract
           = ${fmt(sizing.raw_contracts, 3)} → ${fmt(sizing.contracts, 2)}</div>` : "");
    return;
  }

  card.className = `card signal ${show.side === "LONG" ? "long" : "short"}`;
  $("sig-dir").textContent = show.side;
  $("sig-time").textContent = `${show.symbol} · ${new Date(show.ts).toLocaleTimeString()}`;
  const ai = show.ai;
  $("sig-body").innerHTML = `
    <div class="levels">
      <div class="level"><div class="k">Entry</div><div class="v">${fmt(show.entry)}</div></div>
      <div class="level stop"><div class="k">Stop</div><div class="v">${fmt(show.stop)}</div></div>
      <div class="level tp"><div class="k">TP1 · ${fmt(show.rr1, 1)}R</div><div class="v">${fmt(show.tp1)}</div></div>
      <div class="level tp"><div class="k">TP2 · ${fmt(show.rr2, 1)}R</div><div class="v">${fmt(show.tp2)}</div></div>
      <div class="level"><div class="k">Size</div><div class="v">${fmt(show.qty, 2)}</div></div>
      <div class="level"><div class="k">Risk</div><div class="v">${pct(show.risk_pct * 100)}</div></div>
    </div>
    <div class="muted" style="margin-top:8px">#${show.sequence} · decided on the
      ${new Date(show.decision_ts).toLocaleTimeString()} bar close</div>
    ${ai && ai.rationale ? `<div class="ai-note"><b>AI ${esc(ai.decision)} (${fmt(ai.confidence, 2)})</b> — ${esc(ai.rationale)}
      ${ai.risk_flags?.length ? `<br><span style="color:var(--warn)">flags: ${ai.risk_flags.map(esc).join(", ")}</span>` : ""}</div>` : ""}`;
}

function renderChecksFromState() {
  const recent = state?.recent_signals || [];
  const latest = recent[recent.length - 1];
  if (latest?.strategy_verdict) renderChecks(latest.strategy_verdict, latest.blocked_by);
}

function renderChecks(verdict, reason) {
  const box = $("checks");
  if (!verdict || !verdict.checks?.length) {
    box.innerHTML = `<div class="empty">${esc(reason || "No evaluation yet.")}</div>`;
    $("score").textContent = ""; return;
  }
  $("score").textContent = `${verdict.side} · score ${fmt(verdict.score, 2)}`;
  box.innerHTML = verdict.checks.map((c) => `
    <div class="check ${c.passed ? "pass" : "fail"}">
      <span class="mark">${c.passed ? "✓" : "✕"}</span>
      <span class="nm">${esc(c.name)}</span>
      ${c.required ? "" : '<span class="opt">optional</span>'}
      <span class="dt" title="${esc(c.detail)}">${esc(c.detail)}</span>
    </div>`).join("");
}

function renderRisk() {
  const r = state?.risk; if (!r) return;
  const limits = r.limits || {};
  const pnlClass = r.realized_today > 0 ? "pos" : r.realized_today < 0 ? "neg" : "";
  $("risk").innerHTML = `
    <dt>Equity</dt><dd>${fmt(r.equity)}</dd>
    <dt>Today</dt><dd class="${pnlClass}">${r.realized_today >= 0 ? "+" : ""}${fmt(r.realized_today)} (${pct(r.daily_pnl_pct)})</dd>
    <dt>Trades</dt><dd>${r.trades_today} / ${limits.max_trades_per_day}</dd>
    <dt>Risk per trade</dt><dd>${pct(limits.risk_per_trade_pct)}</dd>
    <dt>Daily loss limit</dt><dd>${pct(limits.max_daily_loss_pct)}</dd>
    <dt>Loss streak</dt><dd>${r.consecutive_losses} / ${limits.max_consecutive_losses}</dd>
    ${r.cooldown_active ? `<dt>Cooldown</dt><dd class="neg">until ${new Date(r.cooldown_until).toLocaleTimeString()}</dd>` : ""}
    ${r.kill_switch ? `<dt>Halted</dt><dd class="neg">${esc(r.kill_reason)}</dd>` : ""}`;
  renderHealth();
  const used = limits.max_trades_per_day ? Math.min(1, r.trades_today / limits.max_trades_per_day) : 0;
  const bar = $("risk-bar");
  bar.style.width = `${used * 100}%`;
  bar.style.background = used >= 1 ? "var(--short)" : used > 0.6 ? "var(--warn)" : "var(--accent)";
}

function renderHealth() {
  const s = state?.status; if (!s) return;
  const feed = s.feed || {}, gate = s.gate || {}, rec = s.reconciliation || {};
  const ps = state?.position_state || {};
  const armed = Object.entries(gate.armed || {}).filter(([, v]) => v).map(([k]) => k);
  $("health").innerHTML = `
    <dt>Feed</dt><dd class="${feed.stale ? "neg" : ""}">${feed.stale ? "stale" : "live"} ·
      ${Math.round(feed.bar_age_seconds || 0)}s / ${Math.round(feed.threshold_seconds || 0)}s</dd>
    <dt>Bars received</dt><dd>${feed.bars_seen ?? 0}</dd>
    <dt>Position</dt><dd>${esc(ps.state || "flat")}${ps.awaiting_exit ? " (runner)" : ""}</dd>
    <dt>Signals armed</dt><dd>${armed.length ? armed.join(", ") : "none"}</dd>
    <dt>Duplicates blocked</dt><dd>${gate.suppressed ?? 0}</dd>
    <dt>Reconciled</dt><dd class="${rec.ok === false ? "neg" : ""}">${
      rec.ok === false ? esc(rec.message) : "yes"}</dd>
    <dt>Audit records</dt><dd>${s.audit?.records ?? 0}</dd>`;
}

function renderPositions() {
  const rows = state?.positions || [];
  $("positions").innerHTML = rows.length ? `
    <table><thead><tr><th>Side</th><th>Qty</th><th>Entry</th><th>Stop</th><th>Open P&L</th></tr></thead>
    <tbody>${rows.map((p) => `<tr>
      <td class="${p.side === "LONG" ? "pos" : "neg"}">${p.side}</td>
      <td>${fmt(p.remaining, 2)}</td><td>${fmt(p.entry_price)}</td><td>${fmt(p.stop)}</td>
      <td class="${p.unrealized >= 0 ? "pos" : "neg"}">${p.unrealized === null ? "—" : fmt(p.unrealized)}</td>
    </tr>`).join("")}</tbody></table>` : `<div class="empty">Flat.</div>`;
}

function renderHistory() {
  const rows = [...(state?.recent_signals || [])].reverse().slice(0, 8);
  const perf = state?.performance;
  $("history").innerHTML = (rows.length ? `
    <table><thead><tr><th>Time</th><th>Side</th><th>Entry</th><th>Outcome</th></tr></thead>
    <tbody>${rows.map((s) => `<tr>
      <td>${new Date(s.ts).toLocaleTimeString()}</td>
      <td class="${s.side === "LONG" ? "pos" : s.side === "SHORT" ? "neg" : ""}">${s.side}</td>
      <td>${s.actionable ? fmt(s.entry) : "—"}</td>
      <td title="${esc(s.blocked_by)}" style="font-family:inherit;color:var(--muted)">${s.actionable ? "taken" : esc(truncate(s.blocked_by, 34))}</td>
    </tr>`).join("")}</tbody></table>` : `<div class="empty">Nothing yet.</div>`)
    + (perf?.trades ? `<div class="muted" style="margin-top:8px">${perf.trades} closed · ${pct(perf.win_rate * 100, 0)} wins · ${fmt(perf.expectancy_r, 2)}R average</div>` : "");
}

/* ---------------------------------------------------------------- chart */

const EMA_COLORS = ["#5b9dff", "#e0a33e", "#f472b6"];
const OVERLAY_COLORS = { VWAP: "#a78bfa" };

function ema(values, period) {
  const out = new Array(values.length).fill(null);
  if (values.length < period) return out;
  const k = 2 / (period + 1);
  let prev = values.slice(0, period).reduce((a, b) => a + b, 0) / period;
  out[period - 1] = prev;
  for (let i = period; i < values.length; i++) { prev = values[i] * k + prev * (1 - k); out[i] = prev; }
  return out;
}

function drawChart() {
  const canvas = $("chart"), ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (candles.length < 2) return;

  const view = candles.slice(-120);
  const padL = 6, padR = 62, padY = 12;
  const sig = state?.last_actionable_signal;
  const showSig = sig && state?.positions?.some((p) => p.signal_id === sig.id);

  let lo = Math.min(...view.map((c) => c.low)), hi = Math.max(...view.map((c) => c.high));
  if (showSig) { lo = Math.min(lo, sig.stop, sig.tp1, sig.tp2); hi = Math.max(hi, sig.stop, sig.tp1, sig.tp2); }
  const vwap = state?.context?.vwap;
  if (vwap) { lo = Math.min(lo, vwap); hi = Math.max(hi, vwap); }
  const span = (hi - lo) || 1;
  lo -= span * 0.04; hi += span * 0.04;
  const y = (p) => padY + (hi - p) / (hi - lo) * (h - padY * 2);
  const bw = (w - padL - padR) / view.length;

  ctx.strokeStyle = "#1a212c"; ctx.lineWidth = 1;
  ctx.font = "10px ui-monospace, monospace"; ctx.fillStyle = "#5d6a7e";
  for (let i = 0; i <= 4; i++) {
    const p = lo + (hi - lo) * (i / 4), py = Math.round(y(p)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(w - padR, py); ctx.stroke();
    ctx.fillText(p.toFixed(2), w - padR + 6, py + 3);
  }

  view.forEach((c, i) => {
    const x = padL + i * bw + bw / 2;
    const up = c.close >= c.open;
    ctx.strokeStyle = ctx.fillStyle = up ? "#22c55e" : "#ef4444";
    ctx.globalAlpha = c.closed === false ? 0.55 : 1;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y(c.high)); ctx.lineTo(x, y(c.low)); ctx.stroke();
    const top = y(Math.max(c.open, c.close)), bot = y(Math.min(c.open, c.close));
    ctx.fillRect(x - Math.max(1, bw * 0.32), top, Math.max(2, bw * 0.64), Math.max(1, bot - top));
    ctx.globalAlpha = 1;
  });

  const closes = view.map((c) => c.close);
  const specs = (state?.status?.overlays || []).filter((o) => o.type === "ema");
  const overlays = specs.map((o, i) => [ema(closes, o.period), EMA_COLORS[i % EMA_COLORS.length], o.label]);
  overlays.forEach(([, color, label]) => { OVERLAY_COLORS[label] = color; });
  for (const [seriesVals, color] of overlays) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.beginPath();
    let started = false;
    seriesVals.forEach((v, i) => {
      if (v === null) return;
      const x = padL + i * bw + bw / 2;
      started ? ctx.lineTo(x, y(v)) : (ctx.moveTo(x, y(v)), started = true);
    });
    ctx.stroke();
  }

  if (vwap) hline(ctx, y(vwap), padL, w - padR, "#a78bfa", [5, 4], "VWAP");
  if (showSig) {
    hline(ctx, y(sig.entry), padL, w - padR, "#e6edf6", [2, 3], "entry");
    hline(ctx, y(sig.stop), padL, w - padR, "#ef4444", [6, 3], "stop");
    hline(ctx, y(sig.tp1), padL, w - padR, "#22c55e", [6, 3], "tp1");
    hline(ctx, y(sig.tp2), padL, w - padR, "#16a34a", [6, 3], "tp2");
  }

  const items = state?.context?.display || [];
  $("chart-legend").innerHTML = items.map((item) => {
    const color = OVERLAY_COLORS[item.label];
    const value = typeof item.value === "number"
      ? fmt(item.value, item.digits ?? 2) + (item.suffix || "")
      : esc(item.value ?? "—");
    return color
      ? `<span style="color:${color}">${esc(item.label)} ${value}</span>`
      : `${esc(item.label)} ${value}`;
  }).join(" &nbsp;·&nbsp; ");
}

function hline(ctx, py, x0, x1, color, dash, label) {
  ctx.save();
  ctx.strokeStyle = color; ctx.setLineDash(dash); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, py + 0.5); ctx.lineTo(x1, py + 0.5); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle = color; ctx.font = "9px ui-monospace, monospace";
  ctx.fillText(label, x0 + 3, py - 3);
  ctx.restore();
}

/* ----------------------------------------------------------------- chat */

const turns = new Map();

function addMessage(cls, text) {
  const el = document.createElement("div");
  el.className = `msg ${cls}`; el.textContent = text;
  $("log").appendChild(el); $("log").scrollTop = $("log").scrollHeight;
  return el;
}
const logSystem = (text) => addMessage("sys", text);

function chatStart(id) {
  const el = addMessage("bot", ""); el.classList.add("cursor");
  turns.set(id, el);
}
function chatDelta(id, text) {
  const el = turns.get(id); if (!el) return;
  el.textContent += text; $("log").scrollTop = $("log").scrollHeight;
}
function chatEnd(id) {
  const el = turns.get(id); if (el) el.classList.remove("cursor");
  turns.delete(id);
}

function sendChat() {
  const input = $("input"), text = input.value.trim();
  if (!text) return;
  addMessage("user", text); input.value = "";
  send({ action: "chat", message: text });
}

const SUGGESTIONS = [
  "Why no trade on the last bar?",
  "What would need to change for a long?",
  "How much risk budget is left today?",
  "Walk me through the sizing on the last signal.",
];

/* ----------------------------------------------------------------- init */

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (ch) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
const truncate = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");

$("send").addEventListener("click", sendChat);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
$("btn-kill").addEventListener("click", () => {
  send({ action: state?.risk?.kill_switch ? "resume" : "kill" });
});
$("btn-flatten").addEventListener("click", () => send({ action: "flatten" }));
$("suggest").innerHTML = SUGGESTIONS.map((s) => `<button data-q="${esc(s)}">${esc(s)}</button>`).join("");
$("suggest").addEventListener("click", (e) => {
  const q = e.target.dataset?.q; if (!q) return;
  $("input").value = q; sendChat();
});
window.addEventListener("resize", drawChart);
setInterval(() => send({ action: "ping" }), 25000);
connect();
</script>
